[package]
name = "claude-code"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dialoguer = "0.11"
colored = "2.1"
dotenv = "0.15"
